<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付成功 - 感谢您的购买</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            padding: 48px 40px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .icon-wrapper {
            width: 80px;
            height: 80px;
            background: #e8f5e9;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px;
        }
        .icon-wrapper svg {
            width: 48px;
            height: 48px;
            fill: #2e7d32;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .subtitle {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .order-info {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 16px;
            border: 1px solid #e9edf2;
        }
        .order-info .label {
            font-size: 14px;
            color: #6b7280;
            font-weight: 500;
        }
        .order-info .value {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a2e;
            background: #ffffff;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
        }
        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 32px;
        }
        .detail-item {
            background: #f8fafc;
            border-radius: 10px;
            padding: 12px 10px;
            border: 1px solid #edf2f7;
        }
        .detail-item .label {
            display: block;
            font-size: 12px;
            color: #9ca3af;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }
        .detail-item .value {
            font-size: 15px;
            font-weight: 600;
            color: #1f2937;
        }
        .btn {
            display: inline-block;
            padding: 14px 36px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }
        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
        }
        .btn-secondary {
            background: transparent;
            color: #4b5563;
            box-shadow: none;
            border: 2px solid #e5e7eb;
            margin-left: 12px;
            padding: 12px 28px;
        }
        .btn-secondary:hover {
            background: #f3f4f6;
            box-shadow: none;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 24px;
            font-size: 13px;
            color: #9ca3af;
            border-top: 1px solid #edf2f7;
            padding-top: 20px;
        }
        .footer a {
            color: #2563eb;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        /* 小屏优化 */
        @media (max-width: 420px) {
            .card {
                padding: 32px 20px 28px;
            }
            h1 {
                font-size: 22px;
            }
            .details {
                grid-template-columns: 1fr;
            }
            .btn-secondary {
                margin-left: 0;
                margin-top: 10px;
                display: block;
            }
        }
    </style>
    <link rel="stylesheet" type="text/css" href="./css/modern-theme.css" />
</head>
<body>
    <!-- 流星特效 -->
    <div class=shooting-star></div>
    <div class=shooting-star></div>
    <div class=shooting-star></div>

    <div class="card">
        <!-- 成功图标（对勾） -->
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
        </div>

        <h1>🎉 支付成功</h1>
        <p class="subtitle">您的订单已支付完成，感谢您的信任与支持！</p>

        <!-- 模拟订单信息（可被后端动态替换） -->
        <div class="order-info">
            <span class="label">订单编号</span>
            <span class="value" id="orderId" th:text=${orderId}></span>
        </div>

        <!-- 交易详情 -->
        <div class="details">
            <div class="detail-item">
                <span class="label">支付金额</span>
                <span class="value" id="payAmount" th:text=${totalAmount}></span>
            </div>
            <div class="detail-item">
                <span class="label">支付方式</span>
                <span class="value" id="payMethod">支付宝支付</span>
            </div>
            <div class="detail-item">
                <span class="label">交易时间</span>
                <span class="value" id="payTime" th:text=${payTime}></span>
            </div>
            <div class="detail-item">
                <span class="label">支付状态</span>
                <span class="value" style="color: #2e7d32;">已完成 ✅</span>
            </div>
        </div>
		
		<!-- 操作按钮 -->
		<div>
			<a href="order_list.html" class="btn" id="btnViewOrder">查看订单</a>
			<a href="index.html" class="btn btn-secondary" id="btnContinue">继续购物</a>
		</div>


        

        <div class="footer">
            如有任何问题，请联系 <a href="mailto:support@example.com">support@example.com</a>
            <br>
            <span style="color: #d1d5db; font-size: 12px;">交易流水号：<no th:text=${id}></no></span>
        </div>
    </div>

   
</body>
</html>
