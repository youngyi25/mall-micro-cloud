<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>OSS 文件管理后台</title>
    <!-- Bootstrap5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 900px;
            margin-top: 40px;
        }
        .card {
            margin-bottom: 20px;
        }
        .result-text {
            word-break: break-all;
        }
    </style>
</head>
<body>
<div class="container">
    <h2 class="text-center mb-4">阿里云 OSS 文件操作面板</h2>

    <!-- 1. 文件上传区域 -->
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">文件上传</h5>
        </div>
        <div class="card-body">
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">存储目录</label>
                <div class="col-sm-10">
                    <input type="text" id="uploadDir" class="form-control" value="file" placeholder="如 avatar / product / order">
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">选择文件</label>
                <div class="col-sm-10">
                    <input type="file" id="fileInput" class="form-control">
                </div>
            </div>
            <button class="btn btn-primary" id="uploadBtn">开始上传</button>
            <div class="mt-3">
                <p class="mb-1">上传结果：</p>
                <p id="uploadResult" class="text-success result-text"></p>
            </div>
        </div>
    </div>

    <!-- 2. 获取私有文件临时签名URL -->
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0">获取私有文件临时访问链接（30分钟有效）</h5>
        </div>
        <div class="card-body">
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">文件ObjectKey</label>
                <div class="col-sm-10">
                    <input type="text" id="signKey" class="form-control" placeholder="file/2026/07/xxx.jpg">
                </div>
            </div>
            <button class="btn btn-success" id="getSignBtn">生成签名链接</button>
            <div class="mt-3">
                <p class="mb-1">临时URL：</p>
                <a id="signUrlResult" target="_blank" class="text-break"></a>
            </div>
        </div>
    </div>

    <!-- 3. 文件下载 -->
    <div class="card shadow-sm">
        <div class="card-header bg-info text-white">
            <h5 class="mb-0">文件下载</h5>
        </div>
        <div class="card-body">
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">文件ObjectKey</label>
                <div class="col-sm-10">
                    <input type="text" id="downloadKey" class="form-control" placeholder="file/2026/07/xxx.jpg">
                </div>
            </div>
            <button class="btn btn-info" id="downloadBtn">点击下载</button>
        </div>
    </div>

    <!-- 4. 文件删除 -->
    <div class="card shadow-sm">
        <div class="card-header bg-danger text-white">
            <h5 class="mb-0">文件删除（谨慎操作）</h5>
        </div>
        <div class="card-body">
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">文件ObjectKey</label>
                <div class="col-sm-10">
                    <input type="text" id="deleteKey" class="form-control" placeholder="file/2026/07/xxx.jpg">
                </div>
            </div>
            <button class="btn btn-danger" id="deleteBtn">删除文件</button>
            <p id="deleteTip" class="mt-2"></p>
        </div>
    </div>
</div>

<!-- Toast 提示弹窗 -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="msgToast" class="toast hide" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto">系统提示</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body" id="toastBody"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 后端接口基础地址，根据你的服务端口修改
    const baseUrl = "http://localhost:9000/api/aliyun/oss";
    const toast = new bootstrap.Toast(document.getElementById('msgToast'));

    // 全局提示方法
    function showMsg(text) {
        document.getElementById('toastBody').innerText = text;
        toast.show();
    }

    // 1. 文件上传
    document.getElementById('uploadBtn').addEventListener('click', async function () {
        const file = document.getElementById('fileInput').files[0];
        const dir = document.getElementById('uploadDir').value.trim();
        if (!file) {
            showMsg("请选择上传文件");
            return;
        }
        const formData = new FormData();
        formData.append("file", file);
        formData.append("dir", dir);

        try {
            const res = await fetch(`${baseUrl}/upload`, {
                method: "POST",
                body: formData
            });
            const result = await res.text();
			resultJson = JSON.parse(result)
			const url = resultJson.data
            document.getElementById('uploadResult').innerText = url;
			const objKey = url.split(".com/")[1]
			document.getElementById('signKey').value = objKey
			document.getElementById('downloadKey').value = objKey
			document.getElementById('deleteKey').value = objKey
            showMsg("上传成功");
        } catch (err) {
            showMsg("上传失败：" + err);
        }
    });

    // 2. 获取私有文件签名URL
    document.getElementById('getSignBtn').addEventListener('click', async function () {
        const key = document.getElementById('signKey').value.trim();
        if (!key) {
            showMsg("请输入文件ObjectKey");
            return;
        }
        try {
            const res = await fetch(`${baseUrl}/signUrl?objectKey=${encodeURIComponent(key)}`);
            const result = await res.text();
            resultJson = JSON.parse(result)
            const url = resultJson.data
            const aTag = document.getElementById('signUrlResult');
            aTag.href = url;
            aTag.innerText = url;
            showMsg("临时链接生成成功，有效期30分钟");
        } catch (err) {
            showMsg("获取链接失败：" + err);
        }
    });

    // 3. 文件下载
    document.getElementById('downloadBtn').addEventListener('click', function () {
        const key = document.getElementById('downloadKey').value.trim();
        if (!key) {
            showMsg("请输入文件ObjectKey");
            return;
        }
        // 直接新开窗口触发下载
        window.open(`${baseUrl}/download?objectKey=${encodeURIComponent(key)}`);
    });

    // 4. 删除文件
    document.getElementById('deleteBtn').addEventListener('click', async function () {
        const key = document.getElementById('deleteKey').value.trim();
        if (!key) {
            showMsg("请输入文件ObjectKey");
            return;
        }
        if (!confirm("确认永久删除该文件？不可恢复！")) return;

        try {
            const res = await fetch(`${baseUrl}/delete?objectKey=${encodeURIComponent(key)}`, {
                method: "DELETE"
            });
            const msg = await res.text();
            document.getElementById('deleteTip').className = "mt-2 text-success";
            document.getElementById('deleteTip').innerText = msg;
            showMsg("文件删除成功");
        } catch (err) {
            document.getElementById('deleteTip').className = "mt-2 text-danger";
            document.getElementById('deleteTip').innerText = "删除失败";
            showMsg("删除失败：" + err);
        }
    });
</script>
</body>
</html>
