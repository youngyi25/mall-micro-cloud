server:
  port: 9009
spring:
  application:
    name: mall-oss-service
  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  cloud:
    nacos:
      server-addr: 192.168.150.101:8848
      config:
        import-check:
          enabled: false
jwt:
  secret-key: MDk4ZjZiY2Q0NjIxZDM3M2NhZGU0ZTgzMjYyN2I0ZjY # 密钥
  expire-time: 3600000 # 过期时间,单位毫秒,30分钟
---
aliyun:
  cloud:
    access-key-id: ${OSS_ACCESS_KEY}
    access-key-secret: ${OSS_SECRET_KEY}
    # 当前Bucket地域节点
    endpoint: oss-cn-beijing.aliyuncs.com
    # 项目使用的存储空间
    bucket-name: oss-mall-micro-2026
  oss:
    # 自定义配置：上传路径前缀
    prefix: temp